<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="robots" content="noindex">
<title>朋友推給你的口袋愛店 · 餓選E</title>
<link rel="stylesheet" href="../assets/site.css?v=3">
<script src="../assets/theme.js?v=1"></script>
</head>
<body>
<main>
<header class="site">
  <img src="../assets/app_icon.png" alt="餓選E 圖示">
  <div><h1>餓選E</h1><p>現在，吃哪一家？</p></div>
</header>

<h1 id="title">朋友推給你的口袋愛店</h1>
<div id="list"></div>
<p id="empty" class="meta" hidden>這個連結沒有可以顯示的店家，可能沒有複製完整。</p>

<p id="opening" class="meta" hidden>正在打開餓選E…</p>
<p><a id="open" class="btn" href="#">在餓選E打開</a></p>
<div id="download" class="card" hidden>
  <strong>還沒有餓選E？</strong>
  <p id="download-soon" class="meta">App 即將上架，敬請期待。上架後，下載餓選E 再回來點這個連結，就能把這些店收進口袋。</p>
  <p><a id="download-link" class="btn ghost" href="#" hidden>下載餓選E</a></p>
</div>
<p class="meta">已經安裝餓選E？頁面會自動打開 App；沒有反應的話請點上面的按鈕。</p>

<footer><a href="../">餓選E 支援首頁</a> · <a href="../privacy.html">隱私權政策</a><br>
店家資料放在網址的 # 之後，只在你的瀏覽器裡讀取，不會傳送到伺服器。</footer>
</main>
<script>
// 安全原則：分享碼是別人產生的，不可信。只解析 JSON、只用 textContent 顯示純文字，
// 絕不使用 innerHTML；長度與店家數都有上限；「打開」按鈕只會組出固定格式的 eatmatch:// 網址。
// 下載連結：上架或開放 TestFlight 公開測試後填入（App Store／TestFlight 網址），空字串表示尚未上架。
var DOWNLOAD_URL = '';

// 自動打開 App：iPhone／Android 上載入後試一次；1.6 秒後頁面仍在前景，表示沒裝 App，改顯示下載區。
// 每個連結在同一個分頁只自動試一次，避免使用者按「返回」又被帶走。
function autoOpen(appUrl) {
  var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var key = 'eatmatch-tried:' + location.hash.length + ':' + location.hash.slice(-16);
  var showDownload = function () {
    document.getElementById('opening').hidden = true;
    document.getElementById('download').hidden = false;
    if (DOWNLOAD_URL) {
      var link = document.getElementById('download-link');
      link.href = DOWNLOAD_URL;
      link.hidden = false;
      document.getElementById('download-soon').hidden = true;
    }
  };
  if (!mobile) { showDownload(); return; }
  var tried = false;
  try { tried = sessionStorage.getItem(key) === '1'; sessionStorage.setItem(key, '1'); } catch (e) {}
  if (tried) { showDownload(); return; }
  document.getElementById('opening').hidden = false;
  var timer = setTimeout(showDownload, 1600);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearTimeout(timer);
  });
  window.location.href = appUrl;
}

(function () {
  var MAX_CODE = 64 * 1024, MAX_SPOTS = 100, MAX_TEXT = 60;
  function param(name) {
    var sources = [location.hash.replace(/^#/, ''), location.search.replace(/^\?/, '')];
    for (var i = 0; i < sources.length; i++) {
      var parts = sources[i].split('&');
      for (var j = 0; j < parts.length; j++) {
        var kv = parts[j].split('=');
        if (kv[0] === name && kv.length > 1) {
          try { return decodeURIComponent(kv.slice(1).join('=').replace(/\+/g, '%2B')); }
          catch (e) { return null; }
        }
      }
    }
    return null;
  }
  function clean(v, max) {
    var s = (v === null || v === undefined) ? '' : String(v);
    s = s.replace(/[\u0000-\u001F\u007F-\u009F​‌‎‏‪-‮⁠-⁩﻿]/g, '')
         .replace(/\s+/g, ' ').trim();
    return Array.from(s).slice(0, max).join('');
  }
  // EM2: raw deflate 壓縮的 JSON（新版）；EM1: 未壓縮的 JSON（舊海報、舊連結）。
  var MAX_INFLATED = 64 * 1024;
  function bytesOf(code) {
    var b = code.slice(4).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function inflate(bytes) {
    if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('no inflate'));
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).arrayBuffer().then(function (buf) {
      if (buf.byteLength > MAX_INFLATED) throw new Error('too large');
      return new Uint8Array(buf);
    });
  }
  function decode(code) {
    if (!code || code.length > MAX_CODE) return Promise.resolve(null);
    var v2 = code.indexOf('EM2:') === 0;
    if (!v2 && code.indexOf('EM1:') !== 0) return Promise.resolve(null);
    var raw;
    try { raw = bytesOf(code); } catch (e) { return Promise.resolve(null); }
    return (v2 ? inflate(raw) : Promise.resolve(raw)).then(function (bytes) {
      var data = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
      return (data && Array.isArray(data.s)) ? data : null;
    }).catch(function () { return null; });
  }
  var code = param('c');
  decode(code).then(function (data) { render(code, data); });
  function render(code, data) {
  var list = document.getElementById('list');
  var spots = data ? data.s.filter(function (x) { return x && typeof x === 'object'; }).slice(0, MAX_SPOTS) : [];
  if (!spots.length) {
    document.getElementById('empty').hidden = false;
    document.getElementById('open').hidden = true;
    return;
  }
  if (spots.length > 1) {
    document.getElementById('title').textContent = '朋友推給你 ' + spots.length + ' 家口袋愛店';
  }
  spots.forEach(function (x) {
    var card = document.createElement('div');
    card.className = 'card';
    var name = document.createElement('strong');
    name.textContent = clean(x.n, MAX_TEXT) || '未命名店家';
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = [clean(x.a, 20), clean(x.b, 4), clean(x.c, 20)].filter(Boolean).join(' · ');
    card.appendChild(name);
    card.appendChild(meta);
    var addr = clean(x.addr, 120);
    if (addr) {
      var a = document.createElement('div');
      a.className = 'meta';
      a.textContent = addr;
      card.appendChild(a);
    }
    list.appendChild(card);
  });
  // 只轉成 URL-safe 字元，組出固定 scheme 的網址，不帶入任何其他輸入。
  // 前綴只會是 EM1: 或 EM2:（decode 已檢查），其餘只留 URL-safe 字元。
  var safe = code.slice(0, 4) + code.slice(4).replace(/[^A-Za-z0-9\-_+\/=]/g, '');
  var appUrl = 'eatmatch://i?c=' + encodeURIComponent(safe);
  document.getElementById('open').href = appUrl;
  autoOpen(appUrl);
  }

})();
</script>
</body>
</html>
